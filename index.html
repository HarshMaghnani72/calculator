<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Calculator - Free Basic & Advanced Math Tool</title>
  <meta name="description" content="Use our free online calculator for quick basic arithmetic, floating-point calculations, and percentage math. Fast, responsive, and easy-to-use web tool with keyboard support.">
  <meta property="og:title" content="Online Calculator - Free Basic & Advanced Math Tool">
  <meta property="og:description" content="Use our free online calculator for quick basic arithmetic, floating-point calculations, and percentage math. Fast, responsive, and easy-to-use web tool with keyboard support.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Online Calculator",
    "operatingSystem": "All",
    "applicationCategory": "CalculatorApplication",
    "description": "Free online calculator for quick basic arithmetic, floating-point calculations, and percentage math.",
    "browser": "Requires JavaScript. Requires HTML5."
  }
  </script>
  <script>
    // Prevent flash of wrong theme
    (function() {
      const savedTheme = localStorage.getItem('calculator-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <main class="main-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
    <div class="calculator-container">
      <div class="calculator-header">
        <h1 class="calculator-title">Calculator</h1>
        <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark and light mode">🌙</button>
      </div>
      <div class="calculator-screen" id="calculator-screen">0</div>
      <div class="calculator-keys">
        <button type="button" class="function" data-action="clear">C</button>
        <button type="button" class="function" data-action="sign">+/-</button>
        <button type="button" class="function" data-action="percent">%</button>
        <button type="button" class="operator" data-action="divide">/</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="operator" data-action="multiply">*</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" class="operator" data-action="subtract">-</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" class="operator" data-action="add">+</button>

        <button type="button" data-digit="0" class="zero">0</button>
        <button type="button" data-action="decimal">.</button>
        <button type="button" class="operator" data-action="equals">=</button>
      </div>
    </div>

    <section class="calculator-description" style="margin-top: 20px; max-width: 320px; font-size: 0.85rem; color: var(--text-color); opacity: 0.8; text-align: center; line-height: 1.4;">
      <h2>About Online Calculator</h2>
      <p>A fast, responsive web-based calculator built for quick basic arithmetic, floating-point calculations, and percentage math. Fully supports mouse interactions, keyboard shortcuts, and dark/light theme toggling for enhanced accessibility and usability.</p>
    </section>
  </main>

  <script type="module">
    import { CalculatorState } from './calc.js';

    const calculator = new CalculatorState();
    const screen = document.getElementById('calculator-screen');

    function updateDisplay() {
      screen.textContent = calculator.displayValue;
    }

    // Theme toggling logic
    const themeToggleBtn = document.getElementById('theme-toggle');

    function updateThemeButton(theme) {
      if (theme === 'dark') {
        themeToggleBtn.textContent = '☀️';
        themeToggleBtn.setAttribute('aria-label', 'Switch to light mode');
      } else {
        themeToggleBtn.textContent = '🌙';
        themeToggleBtn.setAttribute('aria-label', 'Switch to dark mode');
      }
    }

    // Initialize theme button icon based on current document attribute
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    updateThemeButton(currentTheme);

    themeToggleBtn.addEventListener('click', () => {
      const activeTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('calculator-theme', newTheme);
      updateThemeButton(newTheme);
    });

    const keys = document.querySelector('.calculator-keys');
    keys.addEventListener('click', (event) => {
      const { target } = event;
      if (!target.matches('button')) return;

      const digit = target.getAttribute('data-digit');
      const action = target.getAttribute('data-action');

      if (digit !== null) {
        calculator.inputDigit(parseInt(digit, 10));
      } else if (action !== null) {
        switch (action) {
          case 'clear':
            calculator.clear();
            break;
          case 'sign':
            calculator.toggleSign();
            break;
          case 'percent':
            calculator.percentage();
            break;
          case 'decimal':
            calculator.inputDecimal('.');
            break;
          case 'add':
            calculator.handleOperator('+');
            break;
          case 'subtract':
            calculator.handleOperator('-');
            break;
          case 'multiply':
            calculator.handleOperator('*');
            break;
          case 'divide':
            calculator.handleOperator('/');
            break;
          case 'equals':
            calculator.calculateResult();
            break;
        }
      }

      updateDisplay();
    });

    // Keyboard support
    window.addEventListener('keydown', (event) => {
      const { key } = event;
      if (!isNaN(key)) {
        calculator.inputDigit(parseInt(key, 10));
      } else if (key === '.') {
        calculator.inputDecimal('.');
      } else if (key === '+' || key === '-' || key === '*' || key === '/') {
        calculator.handleOperator(key);
      } else if (key === 'Enter' || key === '=') {
        event.preventDefault();
        calculator.calculateResult();
      } else if (key === 'Backspace') {
        calculator.backspace();
      } else if (key === 'Escape' || key === 'c' || key === 'C') {
        calculator.clear();
      } else if (key === '%') {
        calculator.percentage();
      }
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
